<!--
  Supabase → Authentication → Emails → "Reset password"
  Assunto sugerido: Redefinir sua senha — Mercatto
-->
<div style="font-family: Georgia, 'Times New Roman', serif; color: #1a2433; max-width: 520px; margin: 0 auto; padding: 32px 24px; background: #f5f0e6;">
  <p style="letter-spacing: 0.18em; font-size: 12px; color: #8a6a35; margin: 0 0 24px;">MERCATTO · LIVRO-RAZÃO</p>
  <h1 style="font-weight: normal; font-size: 24px; margin: 0 0 16px;">Redefinir senha</h1>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.6;">
    Recebemos um pedido para redefinir a senha da sua conta. Depois de definir a nova senha,
    o sistema vai pedir o código do seu aplicativo autenticador.
  </p>
  <p style="margin: 28px 0;">
    <a href="{{ .SiteURL }}/auth/confirmar/?token_hash={{ .TokenHash }}&type=recovery"
       style="font-family: Helvetica, Arial, sans-serif; background: #1a2433; color: #f5f0e6; padding: 12px 22px; text-decoration: none; letter-spacing: 0.04em;">
      Definir nova senha
    </a>
  </p>
  <p style="font-family: Helvetica, Arial, sans-serif; font-size: 13px; color: #5b6472;">
    Se não foi você, ignore este e-mail — sua senha continua a mesma.
  </p>
</div>
