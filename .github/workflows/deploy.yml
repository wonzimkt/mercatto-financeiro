name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Se algum check falhar, nada vai ao ar.
      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes dos cálculos financeiros
        run: npm test

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path vem do próprio Pages: funciona em /<repo> ou em domínio
      # próprio sem editar o código. As chaves do Supabase são públicas
      # (URL + anon/publishable); cadastre-as em Settings → Secrets and
      # variables → Actions → Variables.
      - name: Build
        run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
